<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Function-Agent · AI 智能助手</title>
  
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  
  <!-- highlight.js 主题 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  
  <!-- 自定义 CSS -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/message.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/math-components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/modal.css" />
  
  <!-- CDN Libraries (global) -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.0/plotly.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.2/lib/browser/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
</head>
<body>
  <!-- 顶栏 -->
  <header id="top-bar" class="top-bar">
    <button id="sidebar-toggle" class="icon-btn" title="切换侧边栏">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 class="top-bar-title">📐 Function-Agent</h1>
    <div class="top-bar-actions">
      <button id="theme-toggle" class="icon-btn" title="切换主题">
        <svg class="icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  
  <!-- 侧边栏 -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="new-chat-btn" class="btn btn-primary btn-full">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建对话
      </button>
    </div>
    <div id="session-list" class="session-list"></div>
  </aside>
  
  <!-- 侧边栏遮罩（移动端） -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  
  <!-- 主聊天区 -->
  <main id="chat-main" class="chat-main">
    <div id="message-list" class="message-list"></div>
    <div id="streaming-indicator" class="streaming-indicator" style="display:none;">
      <div class="dot-typing"><span></span><span></span><span></span></div>
      <span>AI 正在思考...</span>
    </div>
    <div class="input-bar">
      <button id="image-upload-btn" class="icon-btn image-upload-btn" title="上传图片">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <input type="file" id="image-file-input" accept="image/*" multiple style="display:none;" />
      <div class="input-main">
        <div id="image-preview-bar" class="image-preview-bar" style="display:none;"></div>
        <textarea id="message-input" placeholder="输入问题，如：画出 sin(x) 的图像..." rows="1"></textarea>
      </div>
      <button id="send-btn" class="icon-btn send-btn" title="发送">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
      <button id="stop-btn" class="icon-btn stop-btn" title="停止" style="display:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>

    <!-- 欢迎页面（无会话时显示） -->
    <div id="welcome-page" class="welcome-page">
      <div class="welcome-content">
        <h2>📐 欢迎使用Function-Agent</h2>
        <p>AI 驱动的智能助手，支持工具调用与可视化图形</p>
        <div class="welcome-features">
          <div class="feature-card">🎯 极限 · 微积分 · 级数</div>
          <div class="feature-card">📈 函数图像 · 3D 曲面</div>
          <div class="feature-card">🔄 动画演示 · 交互式探索</div>
          <div class="feature-card">📝 分步解题 · 知识点提示</div>
        </div>
        <button id="welcome-new-chat" class="btn btn-primary btn-lg">开始新对话</button>
      </div>
    </div>
  </main>  <div id="settings-dialog" class="dialog-overlay" style="display:none;">
    <div class="dialog">
      <div class="dialog-header">
        <h2>⚙️ 设置</h2>
        <button id="settings-close" class="icon-btn">✕</button>
      </div>
      <div class="dialog-body">
        <!-- ── 大语言模型连接信息 ── -->
        <div class="setting-section">
          <h3>🔗 大语言模型连接信息</h3>
          <div class="setting-field">
            <label for="api-url">API URL</label>
            <input type="text" id="api-url" placeholder="https://api.openai.com/v1" />
          </div>
          <div class="setting-field">
            <label for="api-key">API Key</label>
            <input type="password" id="api-key" placeholder="sk-..." />
          </div>
          <div class="setting-field">
            <label for="model-name">模型名称</label>
            <input type="text" id="model-name" placeholder="gpt-4o" />
          </div>
        </div>
        <!-- ── 图片识别模型(多模态大模型)连接信息 ── -->
        <div class="setting-section">
          <h3>🖼️ 图片识别模型（多模态大模型）连接信息</h3>
          <div class="setting-field">
            <label for="vision-api-url">API URL</label>
            <input type="text" id="vision-api-url" placeholder="https://api.openai.com/v1" />
          </div>
          <div class="setting-field">
            <label for="vision-api-key">API Key</label>
            <input type="password" id="vision-api-key" placeholder="sk-..." />
          </div>
          <div class="setting-field">
            <label for="vision-model-name">模型名称</label>
            <input type="text" id="vision-model-name" placeholder="gpt-4o" />
          </div>
          <div class="setting-field">
            <label for="vision-system-prompt">图片识别提示词</label>
            <textarea id="vision-system-prompt" rows="3" placeholder="让多模态模型看图片内容，返回图片描述..."></textarea>
          </div>
        </div>
        <!-- ── 生成参数 ── -->
        <div class="setting-section">
          <h3>⚙️ 生成参数</h3>
          <div class="setting-field">
            <label for="temperature">Temperature: <span id="temp-val">0.7</span></label>
            <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" />
          </div>
          <div class="setting-field">
            <label for="max-tokens">Max Tokens</label>
            <input type="number" id="max-tokens" value="4096" min="256" max="32768" />
          </div>
        </div>
        <!-- ── System Prompt ── -->
        <div class="setting-section">
          <h3>💬 大语言模型 System Prompt</h3>
          <textarea id="system-prompt" rows="5" placeholder="系统提示词..."></textarea>
        </div>
      </div>
      <div class="dialog-footer">
        <button id="settings-save" class="btn btn-primary">保存</button>
        <button id="settings-cancel" class="btn btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <!-- App JS (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
